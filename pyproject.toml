[project]
name = "ava-pred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.6",
    "common",
    "extract",
    "pandas>=2.2.3",
    "pandas-stubs~=2.2.3",
    "pyarrow>=20.0.0",
    "requests>=2.32.3",
    "transform",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.3.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
    "respx>=0.22",
    "ruff>=0.13.0",
    "types-requests>=2.32",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
common = { workspace = true }
extract = { workspace = true }
transform = { workspace = true }

# Ruff configuration
[tool.ruff]
line-length = 99
indent-width = 4
target-version = "py313"
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade - modern syntax
    "B",      # flake8-bugbear - common bugs
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
    "ASYNC",  # async best practices
]
ignore = [
    "E203",    # whitespace before ':'
    "E501",    # line too long (handled by formatter)
    "S101",    # use of assert (common in tests)
    "T201",    # print statements (useful for debugging)
    "COM812",  # trailing comma (handled by formatter)
    "ISC001",  # single line implicit string concatenation
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "E402"]
"tests/*.py" = ["S101", "F401", "F811", "ARG001"]
"scripts/*.py" = ["T201", "S603", "S607"]
"experiments/*.py" = ["T201", "S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

# Mypy configuration
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^.venv/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "pyproj.*", "aiohttp.*", "typer.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["extract.cli", "transform.cli"]
disallow_untyped_decorators = false

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
