[project]
name = "extract"
version = "0.1.0"
description = "Data extraction module for ava-pred"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12",
    "pandas>=2.2",
    "pyarrow>=20.0",
    "requests>=2.32",
    "typer>=0.15",
    "common",
]

[project.scripts]
ava-extract = "extract.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extract"]
