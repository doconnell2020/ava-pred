[project]
name = "transform"
version = "0.1.0"
description = "Data transformation module for ava-pred"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyproj>=3.7",
    "typer>=0.15",
    "common",
]

[project.scripts]
ava-transform = "transform.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transform"]
